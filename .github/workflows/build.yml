name: Build unsigned IPA

# Runs on every push to main, and whenever you click "Run workflow" in the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # GitHub-hosted macOS machine with Xcode preinstalled

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project from project.yml
        run: xcodegen generate

      - name: Build the app (no code signing — Sideloadly signs it later)
        run: |
          set -o pipefail
          xcodebuild \
            -project WallE.xcodeproj \
            -scheme WallE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .app into an unsigned .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WallE.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build output not found at $APP_PATH"; ls -R build/Build/Products || true; exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WallE.ipa Payload >/dev/null
          echo "Built WallE.ipa"

      - name: Upload the IPA as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallE-unsigned-ipa
          path: WallE.ipa
          if-no-files-found: error
