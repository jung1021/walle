name: WallE
options:
  bundleIdPrefix: com.logan
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  VLCKitSPM:
    url: https://github.com/koombea/vlckit-spm
    from: "3.6.0"
targets:
  WallE:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: VLCKitSPM
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Wall-E
        UILaunchScreen: {}
        # Background audio keeps the app alive with the screen off (used in a later stage).
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Wall-E listens for its wake word.
        NSSpeechRecognitionUsageDescription: Wall-E recognizes the spoken phrase that triggers it.
        NSLocalNetworkUsageDescription: Wall-E finds and streams your camera over your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.logan.walle
        MARKETING_VERSION: "0.6.4"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        GENERATE_INFOPLIST_FILE: NO
# Explicit shared scheme so `xcodebuild -scheme WallE` works in CI.
schemes:
  WallE:
    build:
      targets:
        WallE: all
    run:
      config: Release
    archive:
      config: Release
